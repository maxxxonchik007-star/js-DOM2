<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <h1 class="page__title">Фотогалерея</h1>

    <div id="gallery" class="gallery"></div>

    <p id="message" class="message"></p>

    <div class="controls">
      <button id="loadBtn" class="controls__btn" type="button">Завантажити ще 4</button>
      <button id="clearBtn" class="controls__btn controls__btn--danger" type="button">Очистити галерею</button>
      <button id="removeBtn" class="controls__btn controls__btn--danger" type="button">Видалити останню</button>
      <button id="reverseBtn" class="controls__btn" type="button">Перевернути галерею</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
